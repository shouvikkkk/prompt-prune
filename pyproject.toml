[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-prune"
version = "0.1.0"
description = "Provenance-aware pruner for agent instruction files (CLAUDE.md, AGENTS.md, ...)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Shouvik Maji" }]

[project.scripts]
prompt-prune = "promptprune.cli:main"

[tool.setuptools.packages.find]
include = ["promptprune*"]
